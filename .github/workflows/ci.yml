name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run against freshly-resolved dependencies. A green build on a
    # stale lockfile is what let the mcp 2.0 release break every fresh
    # install for six weeks without CI noticing.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy --strict)
        run: mypy --strict src

      - name: Security scan (bandit)
        run: bandit -q -r src

      - name: Run tests (warnings are errors)
        run: pytest -q -W error

  # The package supports both mcp majors via a compat import. Pin each one
  # explicitly so a breaking SDK release fails CI instead of silently
  # breaking `pip install callrail-mcp` for end users.
  mcp-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp-version: ["mcp>=1.23.0,<2", "mcp>=2,<3"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with ${{ matrix.mcp-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.mcp-version }}"

      - name: Verify import and tool registration
        env:
          CALLRAIL_API_KEY: dummy
        run: |
          python -c "
          import mcp, callrail_mcp.server as s
          n = len(s.mcp._tool_manager.list_tools())
          print(f'tools registered: {n}')
          assert n > 50, n
          "

      - name: Run tests
        env:
          CALLRAIL_API_KEY: dummy
        run: pytest -q

  # Catch packaging regressions: the wheel must carry py.typed, and the
  # sdist must not sweep in local working-copy state.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Assert py.typed ships and no local state leaks
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("callrail_mcp/py.typed") for n in names), "py.typed missing from wheel"
          sdist = glob.glob("dist/*.tar.gz")[0]
          bad = [n for n in tarfile.open(sdist).getnames()
                 if "/.claude" in n or "/.hypothesis" in n or n.endswith(".api-key")]
          assert not bad, f"local state leaked into sdist: {bad}"
          print("packaging OK")
          PY
